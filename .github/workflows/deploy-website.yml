name: Deploy website

# Publishes this static site to Cloudflare Pages on every push to main.
#
# It uses Vizoalica's one-script-tag install (no signed tokens). The tag's values come from
# repository secrets and are injected into a staged copy of the site in CI only; they are never
# committed to the repository.
#
# Repository secrets:   CF_API_TOKEN (Cloudflare Pages: Edit), CF_ACCOUNT_ID,
#                       VIZOALICA_INGEST_ENDPOINT (e.g. https://<backend>/v1/events:batch),
#                       VIZOALICA_WEBSITE_KEY
# Repository variable:  CF_PAGES_PROJECT
#
# The Vizoalica website must not require signed tokens (see docs/operations/pages.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Stage the site and inject the Vizoalica script tag
        env:
          VIZOALICA_INGEST_ENDPOINT: ${{ secrets.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_WEBSITE_KEY: ${{ secrets.VIZOALICA_WEBSITE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          missing=()
          for name in VIZOALICA_INGEST_ENDPOINT VIZOALICA_WEBSITE_KEY CF_ACCOUNT_ID CF_API_TOKEN CF_PAGES_PROJECT; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets/variables: ${missing[*]}"
            exit 1
          fi
          # Values end up in HTML, so allow only visible characters and none that could break out of an attribute.
          for name in VIZOALICA_INGEST_ENDPOINT VIZOALICA_WEBSITE_KEY; do
            value="${!name}"
            if [[ "$value" =~ [^[:graph:]] || "$value" == *\"* || "$value" == *\'* || "$value" == *\<* \
              || "$value" == *\>* || "$value" == *\\* || "$value" == *\&* || "$value" == *\|* ]]; then
              echo "::error::$name contains a character that is not allowed"
              exit 1
            fi
          done
          if [[ ! "$VIZOALICA_INGEST_ENDPOINT" =~ ^https://[^/]+(/.*)?$ ]]; then
            echo "::error::VIZOALICA_INGEST_ENDPOINT must be an https:// address"
            exit 1
          fi
          # The backend serves the SDK at /vizoalica.js on the same origin as the ingest endpoint.
          origin="$(echo "$VIZOALICA_INGEST_ENDPOINT" | sed -E 's#^(https://[^/]+).*#\1#')"
          tag="<script defer src=\"${origin}/vizoalica.js\" data-source=\"${VIZOALICA_WEBSITE_KEY}\" data-token-url=\"none\"></script>"

          rm -rf _site && mkdir _site
          cp ./*.html styles.css app.js _site/
          for f in _site/*.html; do
            if ! grep -q '<script async src="/vizoalica-loader.js"></script>' "$f"; then
              echo "::error::$f has no loader tag to replace"
              exit 1
            fi
            # '|' is excluded from the values above, so it is a safe sed delimiter.
            sed -i "s|<script async src=\"/vizoalica-loader.js\"></script>|${tag}|" "$f"
          done
          echo "Staged $(ls _site | wc -l) files; script origin ${origin}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 pages deploy _site \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$DEPLOY_BRANCH"
